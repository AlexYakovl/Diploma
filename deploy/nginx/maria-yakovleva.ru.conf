map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name maria-yakovleva.ru www.maria-yakovleva.ru;

    # For Certbot (webroot) challenge files
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name maria-yakovleva.ru www.maria-yakovleva.ru;

    # certbot will fill these paths after issuing certs
    ssl_certificate     /etc/letsencrypt/live/maria-yakovleva.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maria-yakovleva.ru/privkey.pem;

    # Multipart uploads to /api/* (default nginx limit is ~1m → 413 Request Entity Too Large)
    client_max_body_size 50m;

    # Blazor Server needs websockets
    location /_blazor {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Full URI must reach the API (/api/...), so proxy_pass has no URI suffix.
    location /api/ {
        proxy_pass http://127.0.0.1:5081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /Storage/ {
        proxy_pass http://127.0.0.1:5081/Storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
